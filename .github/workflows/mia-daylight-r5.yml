name: Build and visually smoke Mia daylight r5

on:
  push:
    branches:
      - arena/09857712-warriors-of-persia
    paths:
      - '.github/workflows/mia-daylight-r5.yml'
      - 'Tools/patch_mia_daylight.py'
      - 'Tools/smoke_mia_daylight.cjs'
      - 'unity_preview/blacksmith-forge.js'

permissions:
  contents: write

jobs:
  mia-daylight:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OLD_TAG: hq8k-daylight-r3
      NEW_TAG: mia-daylight-r5
      APK_NAME: WarriorsOfPersia_3D_HQ_8K.apk
    steps:
      - uses: actions/checkout@v4

      - name: Download and authenticate the Mia-only r3 input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wop-r3
          gh release download "$OLD_TAG" --repo ${{ github.repository }} \
            --pattern "$APK_NAME" --dir /tmp/wop-r3 --clobber
          echo "156f181e52d846063b12b553a42d408032ce9321123739917c829f344c83e6c3  /tmp/wop-r3/$APK_NAME" | sha256sum -c -

      - name: Apply albedo-independent daylight and preserve every HQ texture
        run: |
          set -euo pipefail
          python3 Tools/patch_mia_daylight.py \
            --source-apk "/tmp/wop-r3/$APK_NAME" \
            --output /tmp/wop-r5-unsigned.apk \
            --manifest /tmp/wop-r5-audit.json
          node --check /tmp/wop-r5-unsigned.inline.js
          node --check unity_preview/blacksmith-forge.js
          node --check Tools/smoke_mia_daylight.cjs

      - name: Align, sign, and audit the Mia-only APK
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          STATIC=/tmp/wop-r5-static.txt
          : > "$STATIC"
          "$BT/zipalign" -p -f 4 /tmp/wop-r5-unsigned.apk /tmp/wop-r5-aligned.apk >> "$STATIC" 2>&1
          "$BT/zipalign" -c -p -v 4 /tmp/wop-r5-aligned.apk >> "$STATIC" 2>&1
          umask 077
          mkdir -p /tmp/wop-r5-signing /tmp/wop-r5-final
          PASS=$(openssl rand -hex 32)
          keytool -genkeypair -keystore /tmp/wop-r5-signing/wop-release.keystore \
            -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias wop \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 10000 \
            -dname 'CN=Warriors of Persia, O=PreGames Studio, C=US' >> "$STATIC" 2>&1
          WOP_STORE_PASS="$PASS" WOP_KEY_PASS="$PASS" "$BT/apksigner" sign \
            --ks /tmp/wop-r5-signing/wop-release.keystore --ks-key-alias wop \
            --ks-pass env:WOP_STORE_PASS --key-pass env:WOP_KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "/tmp/wop-r5-final/$APK_NAME" /tmp/wop-r5-aligned.apk
          unset PASS WOP_STORE_PASS WOP_KEY_PASS
          FINAL="/tmp/wop-r5-final/$APK_NAME"
          "$BT/zipalign" -c -p -v 4 "$FINAL" >> "$STATIC" 2>&1
          "$BT/aapt" dump badging "$FINAL" >> "$STATIC" 2>&1
          "$BT/apksigner" verify --verbose "$FINAL" >> "$STATIC" 2>&1
          FINAL="$FINAL" SOURCE="/tmp/wop-r3/$APK_NAME" python3 - <<'PY' > /tmp/wop-r5-content-audit.log 2>&1
          import hashlib, json, os, sys
          from pathlib import Path
          from zipfile import ZipFile
          sys.path.insert(0, 'Tools')
          from build_hq_apk import local_data_offset, sha256
          final = Path(os.environ['FINAL'])
          with ZipFile(final) as apk, ZipFile(os.environ['SOURCE']) as source:
              assert apk.testzip() is None
              manifest = json.loads(apk.read('assets/pbr_hq/manifest.json'))
              assert manifest['build'].startswith('hq8k-mia-daylight-')
              assert manifest['houseLighting']['albedoIndependentEmissiveFill'] is True
              assert manifest['houseLighting']['emissiveMap'] is None
              assert manifest['character'] == {'miaOnly': True, 'attilaPresent': False}
              assert len(manifest['maps']) == 15
              for record in manifest['maps']:
                  raw = apk.read(record['path'])
                  assert raw == source.read(record['path']), record['path']
                  assert sha256(raw) == record['sha256']
                  assert len(raw) == record['bytes']
                  assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
                  chunk = raw.index(b'VP8L')
                  bits = int.from_bytes(raw[chunk + 9:chunk + 13], 'little')
                  width = (bits & 0x3fff) + 1
                  height = ((bits >> 14) & 0x3fff) + 1
                  expected = 8192 if record['family'] == 'metal' else 4096
                  assert (width, height) == (expected, expected), record['path']
              for info in apk.infolist():
                  if info.compress_type == 0:
                      alignment = 4096 if info.filename.endswith('.so') else 4
                      assert local_data_offset(final, info.filename) % alignment == 0, info.filename
              html = apk.read('assets/index.html').decode()
              assert manifest['build'] in html
              assert 'constant-emissive-fill' in html and 'mia-only' in html
              assert 'J.emissiveMap = null' in html
              assert '11040079' in html and '9546183' in html and '12372179' in html
              assert 'Attila_Rigged_3D_Model' not in html
              assert 'ATTILA_GLB_BASE64' not in html
              assert 'آتیلا' not in html
              assert html.count('pbr_hq/') == 15
          raw = open(final, 'rb').read()
          open('/tmp/wop-r5-final.sha256', 'w').write(hashlib.sha256(raw).hexdigest() + '\n')
          open('/tmp/wop-r5-final.size', 'w').write(str(len(raw)) + '\n')
          print('FINAL_CONTENT_AUDIT_PASS: Mia only, constant daylight, 15 original HQ maps and alignment')
          PY
          cat /tmp/wop-r5-content-audit.log
          sha256sum "$FINAL" | tee -a "$STATIC"
          cat /tmp/wop-r5-final.size | tee -a "$STATIC"

      - name: Install r5 on a clean Android 11 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            set +e
            adb shell getprop ro.build.version.release > /tmp/wop-r5-android.txt 2>&1
            adb shell getprop ro.product.cpu.abi > /tmp/wop-r5-abi.txt 2>&1
            adb install "/tmp/wop-r5-final/$APK_NAME" > /tmp/wop-r5-adb.txt 2>&1
            echo $? > /tmp/wop-r5-adb.status
            exit 0

      - name: Require successful emulator installation
        run: |
          set -euo pipefail
          cat /tmp/wop-r5-adb.txt
          test "$(cat /tmp/wop-r5-adb.status)" = "0"
          grep -q 'Success' /tmp/wop-r5-adb.txt

      - name: Install the temporary offline-smoke browser
        run: npm install --prefix /tmp/wop-r5-browser playwright-core@1.65.0 @sparticuz/chromium@153.0.0 pngjs@7.0.0

      - name: Smoke the actual HQ APK offline and capture the village
        env:
          WOP_PLAYWRIGHT_MODULE: /tmp/wop-r5-browser/node_modules/playwright-core
          WOP_CHROMIUM_MODULE: /tmp/wop-r5-browser/node_modules/@sparticuz/chromium/build/index.js
          WOP_PNGJS_MODULE: /tmp/wop-r5-browser/node_modules/pngjs
          WOP_SMOKE_WAIT_MS: '15000'
        run: |
          set -euo pipefail
          rm -rf /tmp/wop-r5-site && mkdir -p /tmp/wop-r5-site
          FINAL="/tmp/wop-r5-final/$APK_NAME" python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          output = Path('/tmp/wop-r5-site')
          with ZipFile(os.environ['FINAL']) as apk:
              for name in apk.namelist():
                  if name.startswith('assets/') and not name.endswith('/'):
                      target = output / name[len('assets/'):]
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(apk.read(name))
          PY
          node Tools/smoke_mia_daylight.cjs \
            --url file:///tmp/wop-r5-site/index.html \
            --screenshot /tmp/wop-r5-smoke.png \
            --report /tmp/wop-r5-smoke.json

      - name: Upload the visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mia-daylight-r5-smoke
          path: |
            /tmp/wop-r5-smoke.png
            /tmp/wop-r5-smoke.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish a draft and verify its download round trip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO=${{ github.repository }}
          FINAL="/tmp/wop-r5-final/$APK_NAME"
          if gh release view "$NEW_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$NEW_TAG" "$FINAL" --repo "$REPO" --clobber
          else
            gh release create "$NEW_TAG" "$FINAL" --repo "$REPO" \
              --target "${{ github.sha }}" --draft \
              --title "Warriors of Persia — Mia Constant Daylight HQ 8K r5" \
              --notes "Draft pending independent visual review. Attila removed; albedo-independent house daylight; all 15 HQ maps preserved."
          fi
          VERIFY=/tmp/wop-r5-roundtrip
          rm -rf "$VERIFY" && mkdir -p "$VERIFY"
          gh release download "$NEW_TAG" --repo "$REPO" --pattern "$APK_NAME" --dir "$VERIFY" --clobber
          cmp "$FINAL" "$VERIFY/$APK_NAME"
          cat /tmp/wop-r5-final.sha256 > /tmp/wop-r5-released
          echo "Draft $NEW_TAG uploaded and round-trip verified; Latest has NOT been changed."

      - name: Write verification summary
        if: always()
        run: |
          {
            echo '## Mia constant-daylight r5 verification'
            echo
            echo '- Attila removed by building from Mia-only r3.'
            echo '- Constant emissive fill is independent of dark albedo pixels.'
            echo '- All 15 HQ texture hashes and native dimensions preserved.'
            echo '- Latest is intentionally unchanged until the uploaded screenshot is reviewed.'
            echo '- Physical-device FPS/RAM/GPU: not measured.'
            echo
            if test -f /tmp/wop-r5-final.sha256; then
              echo "- SHA-256: $(cat /tmp/wop-r5-final.sha256)"
              echo "- Bytes: $(cat /tmp/wop-r5-final.size)"
            fi
            if test -f /tmp/wop-r5-adb.txt; then
              echo '- Emulator install:'; echo '```text'; cat /tmp/wop-r5-adb.txt; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
