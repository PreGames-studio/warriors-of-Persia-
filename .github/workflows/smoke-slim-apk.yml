name: Emulator smoke test of the published APK

# Re-runnable check (no rebuild): installs the APK that is already published, boots it on an emulator, checks that
# the WebView shell really runs the game, then downloads the HD graphics pack
# through the game itself and confirms the textures switch over after a relaunch.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/c0915d8c-warriors-of-persia
    paths:
      - ".github/workflows/smoke-slim-apk.yml"
      - "Tools/emulator_smoke.sh"

permissions:
  contents: read

concurrency:
  group: smoke-slim-apk
  cancel-in-progress: true

env:
  VERSION_NAME: "1.0.15"
  TAG: v1.0.15
  PACKAGE: com.pregames.warriorsofpersia

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download the published APK
        run: |
          set -euo pipefail
          mkdir -p apk
          curl -sSL --retry 3 -o "apk/WarriorsOfPersia_${VERSION_NAME}.apk" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/WarriorsOfPersia_${VERSION_NAME}.apk"
          ls -l apk
          sha256sum apk/*.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Boot the game on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            bash -o pipefail -c 'bash Tools/emulator_smoke.sh "apk/WarriorsOfPersia_${VERSION_NAME}.apk" 2>&1 | tee "$RUNNER_TEMP/smoke.log"'

      - name: Surface the failure
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, urllib.parse
          parts = []
          for path in ("smoke.log", "boot.txt", "pack.txt", "installed.txt"):
              full = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), path)
              if os.path.exists(full):
                  parts.append(f"### {path}\n" + open(full, encoding="utf-8", errors="replace").read()[-1800:])
          text = "\n".join(parts) or "no log captured"
          print("::error title=emulator-smoke::" + urllib.parse.quote(text, safe=" :;,._-/()[]{}"))
          PY
